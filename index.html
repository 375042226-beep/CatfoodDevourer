let imgNG, imgBT, imgJT, bgmAudio, imgsReady = false, imgsLoaded = 0;

function preload() {
    imgNG = new Image();
    imgNG.onload = imgNG.onerror = function() { imgsLoaded++; if (imgsLoaded >= 3) imgsReady = true; };
    imgNG.src = IMG_NAIGAI;
    imgBT = new Image();
    imgBT.onload = imgBT.onerror = function() { imgsLoaded++; if (imgsLoaded >= 3) imgsReady = true; };
    imgBT.src = IMG_BAITAO;
    imgJT = new Image();
    imgJT.onload = imgJT.onerror = function() { imgsLoaded++; if (imgsLoaded >= 3) imgsReady = true; };
    imgJT.src = IMG_JIAOTANG;
    bgmAudio = new Audio(AUDIO_BGM);
    bgmAudio.loop = true;
    bgmAudio.volume = 0.5;
}

let S, sc, lv, lives, nextLife, gt, food, spItems, doorStates;
let NG, BT, JT, spT, drT, cdT, aid, lt = 0;

// ---- Door Management ----
function initDoors() {
    doorStates = DOOR_POS.map(function() { return { open: true, timer: 4 + Math.random() * 6 }; });
}
function updateDoors(dt) {
    for (let i = 0; i < doorStates.length; i++) {
        doorStates[i].timer -= dt;
        if (doorStates[i].timer <= 0) {
            let wc = doorStates[i].open;
            let others = false;
            for (let j = 0; j < doorStates.length; j++) {
                if (j !== i && doorStates[j].open) others = true;
            }
            if (wc && !others) { doorStates[i].timer = 1 + Math.random() * 3; continue; }
            doorStates[i].open = !doorStates[i].open;
            doorStates[i].timer = 3 + Math.random() * 5;
        }
    }
}
function isDoorOpen(c, r) {
    for (let i = 0; i < DOOR_POS.length; i++) {
        if (DOOR_POS[i][0] === c && DOOR_POS[i][1] === r) return doorStates[i].open;
    }
    return false;
}

function cell(r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return W;
    return MAZE[r][c];
}
function walkable(r, c) {
    let v = cell(r, c);
    if (v === P) return true;
    if (v === T) return true;
    if (v === D) return isDoorOpen(c, r);
    return false;
}

// ---- Character Class ----
class Ch {
    constructor(nm, cl, gx, gy, img) {
        this.nm = nm;
        this.cl = cl;
        this.gx = gx;
        this.gy = gy;
        this.img = img;
        this.dx = 0;
        this.dy = 0;
        this.ndx = 0;
        this.ndy = 0;
        this.sp = BASE;
        this.sm = 1;
        this.vis = true;
        this.blk = false;
        this.bt = 0;
        this._lcx = null;
        this._lcy = null;
        this._telCd = 0;
        this._stuck = 0;
    }
    get gxr() { return Math.round(this.gx); }
    get gyr() { return Math.round(this.gy); }
    reset(gx, gy) {
        this.gx = gx;
        this.gy = gy;
        this.dx = 0;
        this.dy = 0;
        this.ndx = 0;
        this.ndy = 0;
        this.sm = 1;
        this._lcx = null;
        this._lcy = null;
        this._telCd = 0;
        this._stuck = 0;
    }
    setD(dx, dy) {
        this.ndx = dx;
        this.ndy = dy;
        this._lcx = null;
        this._lcy = null;
    }
    gDirs() {
        let d = [], gx = Math.round(this.gx), gy = Math.round(this.gy);
        if (walkable(gy - 1, gx)) d.push([0, -1]);
        if (walkable(gy + 1, gx)) d.push([0, 1]);
        if (walkable(gy, gx - 1)) d.push([-1, 0]);
        if (walkable(gy, gx + 1)) d.push([1, 0]);
        return d;
    }
    upd(dt) {
        if (this.blk) {
            this.bt -= dt;
            this.vis = Math.floor(this.bt * 10) % 2 === 0;
            if (this.bt <= 0) { this.blk = false; this.vis = true; }
        }
        let amt = this.sp * this.sm * dt;
        let cx = Math.round(this.gx), cy = Math.round(this.gy);
        let atC = Math.abs(this.gx - cx) < amt * 1.5 && Math.abs(this.gy - cy) < amt * 1.5;
        if (atC && (cx !== this._lcx || cy !== this._lcy)) {
            this._lcx = cx;
            this._lcy = cy;
            this.gx = cx;
            this.gy = cy;
            if (this.ndx !== 0 || this.ndy !== 0) {
                let nx = cx + this.ndx, ny = cy + this.ndy;
                if (walkable(ny, nx)) { this.dx = this.ndx; this.dy = this.ndy; this.ndx = 0; this.ndy = 0; }
            }
            let nx = cx + this.dx, ny = cy + this.dy;
            if ((this.dx !== 0 || this.dy !== 0) && !walkable(ny, nx)) { this.dx = 0; this.dy = 0; }
        }
        if (this.dx !== 0 || this.dy !== 0) {
            this.gx += this.dx * amt;
            this.gy += this.dy * amt;
            let tgx = Math.round(this.gx), tgy = Math.round(this.gy);
            if (this.dx > 0 && !walkable(tgy, tgx) && this.gx > tgx - 0.5) this.gx = tgx - 0.5;
            if (this.dx < 0 && !walkable(tgy, tgx) && this.gx < tgx + 0.5) this.gx = tgx + 0.5;
            if (this.dy > 0 && !walkable(tgy, tgx) && this.gy > tgy - 0.5) this.gy = tgy - 0.5;
            if (this.dy < 0 && !walkable(tgy, tgx) && this.gy < tgy + 0.5) this.gy = tgy + 0.5;
        }
        // Teleport: only for NG, direction-based (left teleport=dx<0, right teleport=dx>0)
        if (this.nm === "奶盖") {
            this._telCd -= dt;
            if (this._telCd <= 0) {
                let grx = Math.round(this.gx), gry = Math.round(this.gy);
                if (cell(gry, grx) === T) {
                    for (let i = 0; i < TELE_PAIRS.length; i++) {
                        let a = TELE_PAIRS[i][0], b = TELE_PAIRS[i][1];
                        // Left teleport: only when moving left (dx < 0)
                        if (grx === a[0] && gry === a[1] && this.dx < 0) {
                            this.gx = b[0] - 0.5;
                            this.gy = b[1];
                            this._lcx = null;
                            this._lcy = null;
                            this._telCd = 0.3;
                            break;
                        }
                        // Right teleport: only when moving right (dx > 0)
                        if (grx === b[0] && gry === b[1] && this.dx > 0) {
                            this.gx = a[0] + 0.5;
                            this.gy = a[1];
                            this._lcx = null;
                            this._lcy = null;
                            this._telCd = 0.3;
                            break;
                        }
                    }
                }
            }
        }
    }
}

// ---- BFS Pathfinding ----
function bfs(fgx, fgy, tgx, tgy) {
    let s = [Math.round(fgy), Math.round(fgx)];
    let g = [Math.round(tgy), Math.round(tgx)];
    if (s[0] === g[0] && s[1] === g[1]) return null;
    let q = [[s[0], s[1]]];
    let v = new Map();
    v.set(s[0] + ',' + s[1], null);
    let p = new Map();
    while (q.length) {
        let r = q[0][0], c = q[0][1];
        q.shift();
        if (r === g[0] && c === g[1]) {
            let ph = [], cur = [r, c];
            while (cur) {
                ph.push(cur);
                cur = p.get(cur[0] + ',' + cur[1]);
            }
            ph.reverse();
            if (ph.length >= 2) {
                let n = ph[1];
                return [n[1] - s[1], n[0] - s[0]];
            }
            return null;
        }
        let dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
        for (let k = 0; k < dirs.length; k++) {
            let dc = dirs[k][0], dr = dirs[k][1];
            let nr = r + dr, nc = c + dc;
            let nk = nr + ',' + nc;
            if (!v.has(nk) && walkable(nr, nc)) {
                v.set(nk, true);
                p.set(nk, [r, c]);
                q.push([nr, nc]);
            }
        }
    }
    return null;
}

// ---- Items ----
const IT = { CF: 0, HP: 1, JK: 2, BL: 3, BE: 4 };
const IC = ['#C8A96E', '#4CAF50', '#D84315', '#42A5F5', '#FFD54F'];
const IS = [10, 30, 50, 0, 0];

function rfg() {
    food = [];
    for (let r = 0; r < ROWS; r++) {
        food[r] = [];
        for (let c = 0; c < COLS; c++) food[r][c] = MAZE[r][c] === P ? IT.CF : -1;
    }
    spItems = [];
}
function cft(t) {
    let n = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (food[r] && food[r][c] === t) n++;
    return n;
}
function gEC() {
    let cs = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (MAZE[r][c] === P && (!food[r] || food[r][c] < 0)) {
            let hs = false;
            for (let k = 0; k < spItems.length; k++) {
                if (!spItems[k].et && spItems[k].gx === c && spItems[k].gy === r) { hs = true; break; }
            }
            if (!hs) cs.push([r, c]);
        }
    }
    return cs;
}
function spRI() {
    var active = 0;
    for (var k = 0; k < spItems.length; k++) {
        if (!spItems[k].et) active++;
    }
    if (active >= 5) return;
    let e = gEC();
    if (!e.length) return;
    let tps = [IT.HP, IT.JK, IT.BE];
    let tp = tps[Math.floor(Math.random() * tps.length)];
    let rc = e[Math.floor(Math.random() * e.length)];
    spItems.push({ type: tp, gx: rc[1], gy: rc[0], et: false, spT: gt });
}
function aIE(ch, tp) {
    switch (tp) {
        case IT.HP:
            ch.sm = Math.max(ch.sm, 1.1);
            setTimeout(function() { if (ch.sm === 1.1) ch.sm = 1; }, 5000);
            break;
        case IT.JK:
            ch.sm = Math.max(ch.sm, 1.1);
            setTimeout(function() { if (ch.sm === 1.1) ch.sm = 1; }, 5000);
            break;
        case IT.BE:
            ch.sm = Math.min(ch.sm, 0.9);
            setTimeout(function() { if (ch.sm === 0.9) ch.sm = 1; }, 5000);
            break;
    }
}

function iLv() {
    rfg();
    initDoors();
    spT = 6;
    cdT = 3;
    gt = 0;
    if (!NG) NG = new Ch("奶盖", "#F5F5DC", 16, 26, imgNG);
    else NG.reset(16, 26);
    if (!BT) BT = new Ch("白桃", "#FF8C42", 17, 16, imgBT);
    else BT.reset(17, 16);
    if (!JT) JT = new Ch("焦糖", "#8B5E3C", 16, 16, imgJT);
    else JT.reset(16, 16);
    BT.sp = BASE * (1 + (lv - 1) * 0.02);
    JT.sp = BASE * (1 + (lv - 1) * 0.02);
    NG.sp = BASE;
}
function sLA() {
    let el = document.getElementById("la");
    el.textContent = lv === 1 ? "准备好了吗？" : ("第 " + lv + " 关");
    el.classList.add("show");
    setTimeout(function() { el.classList.remove("show"); }, 1500);
}

let cv, ctx;
function rsC() {
    cv = document.getElementById("game");
    let mw = Math.min(window.innerWidth - 16, 720);
    let mh = Math.min(window.innerHeight - 280, mw);
    let sz = Math.min(mw, mh);
    CELL = Math.floor((sz - PAD * 2) / Math.max(COLS, ROWS));
    let cw = CELL * COLS + PAD * 2, ch = CELL * ROWS + PAD * 2;
    cv.width = cw;
    cv.height = ch;
    ctx = cv.getContext("2d");
}

function dM() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        let x = PAD + c * CELL, y = PAD + r * CELL, v = MAZE[r][c];
        if (v === W) {
            ctx.fillStyle = "#1a1a4e";
            ctx.fillRect(x, y, CELL, CELL);
            ctx.strokeStyle = "#2a2a6e";
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
        } else if (v === D) {
            let open = isDoorOpen(c, r);
            if (open) {
                ctx.fillStyle = "#111";
                ctx.fillRect(x, y, CELL, CELL);
                ctx.strokeStyle = "#ffcc00";
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, CELL - 4, CELL - 4);
            } else {
                ctx.fillStyle = "#1a1a4e";
                ctx.fillRect(x, y, CELL, CELL);
                ctx.strokeStyle = "#ff4444";
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 1, y + 1, CELL - 2, CELL - 2);
                ctx.fillStyle = "#ff4444";
                ctx.fillRect(x + CELL / 2 - 3, y + CELL / 2 - 3, 6, 6);
            }
        } else if (v === T) {
            ctx.fillStyle = "#0a2a0a";
            ctx.fillRect(x, y, CELL, CELL);
            ctx.fillStyle = "#66ff66";
            ctx.font = "bold " + (CELL * 0.5) + "px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🌀", x + CELL / 2, y + CELL / 2);
        } else {
            ctx.fillStyle = "#111";
            ctx.fillRect(x, y, CELL, CELL);
        }
    }
}

function dI() {
    // Cat food dots
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (!food[r] || food[r][c] < 0) continue;
        let x = PAD + c * CELL + CELL / 2, y = PAD + r * CELL + CELL / 2;
        if (food[r][c] === IT.CF) {
            ctx.fillStyle = IC[0];
            ctx.beginPath();
            ctx.arc(x, y, CELL * 0.11, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    // Special items
    for (let k = 0; k < spItems.length; k++) {
        let it = spItems[k];
        if (it.et) continue;
        let x = PAD + it.gx * CELL + CELL / 2, y = PAD + it.gy * CELL + CELL / 2;
        let s = CELL * 0.33;
        ctx.fillStyle = IC[it.type];
        switch (it.type) {
            case IT.HP:
                ctx.fillRect(x - s * 0.4, y - s, s * 0.8, s * 2);
                ctx.fillStyle = "#388E3C";
                ctx.fillRect(x - s * 0.4, y - s, s * 0.8, s * 0.5);
                break;
            case IT.JK:
                ctx.fillRect(x - s * 0.3, y - s, s * 0.6, s * 2);
                ctx.fillStyle = "#BF360C";
                ctx.fillRect(x - s * 0.3, y - s * 0.3, s * 0.6, s * 0.4);
                break;

            case IT.BE:
                ctx.beginPath();
                ctx.arc(x, y + s * 0.15, s * 0.6, Math.PI, 0);
                ctx.lineTo(x + s * 0.6, y - s * 0.45);
                ctx.arc(x, y - s * 0.45, s * 0.6, 0, Math.PI);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = "#F9A825";
                ctx.beginPath();
                ctx.arc(x, y + s * 0.45, s * 0.18, 0, Math.PI * 2);
                ctx.fill();
                break;
        }
        let pulse = 1 + Math.sin(gt * 4 + it.spT) * 0.15;
        ctx.strokeStyle = "rgba(255,255,255,0.4)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, s * 1.2 * pulse, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function dCh(ch) {
    if (!ch.vis) return;
    let x = PAD + ch.gx * CELL + CELL / 2, y = PAD + ch.gy * CELL + CELL / 2;
    if (ch.img && imgsReady) {
        let sz = CELL * 1.6;
        ctx.save();
        ctx.translate(x, y);
        ctx.drawImage(ch.img, -sz / 2, -sz / 2, sz, sz);
        ctx.restore();
    } else {
        let r = CELL * 0.35;
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = ch.cl;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    if (ch.sm > 1.01) {
        ctx.fillStyle = "#ffcc00";
        ctx.font = "bold " + (CELL * 0.38) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("⚡", x, y - CELL * 0.28);
    }
    if (ch.sm < 0.99) {
        ctx.fillStyle = "#88ccff";
        ctx.font = "bold " + (CELL * 0.38) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🐌", x, y - CELL * 0.28);
    }
}

function dCD() {
    if (cdT <= 0) return;
    let sec = Math.ceil(cdT);
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.font = "bold " + (CELL * 3) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(sec, cv.width / 2, cv.height / 2);
}

// ---- AI ----
function uAI(ch, isBT, dt) {
    let tgx = NG.gx, tgy = NG.gy;
    if (gt < 5) {
        if (isBT) { tgx = COLS - 4; tgy = ROWS - 4; }
        else { tgx = 4; tgy = ROWS - 4; }
    }
    if (isBT) {
        let nj = null, nd = Infinity;
        for (let k = 0; k < spItems.length; k++) {
            let it = spItems[k];
            if (it.et) continue;
            let dx = it.gx - ch.gxr, dy = it.gy - ch.gyr, ds = Math.abs(dx) + Math.abs(dy);
            if (it.type === IT.JK || it.type === IT.HP) {
                if (ds < nd) { nd = ds; nj = it; }

            }
        }
        if (nj) { tgx = nj.gx; tgy = nj.gy; }
    } else {
        let nh = null, nhd = Infinity, nbl = null, nbld = Infinity;
        for (let k = 0; k < spItems.length; k++) {
            let it = spItems[k];
            if (it.et) continue;
            let dx = it.gx - ch.gxr, dy = it.gy - ch.gyr, ds = Math.abs(dx) + Math.abs(dy);
            if (it.type === IT.HP) {
                if (ds <= 10 && ds < nhd) { nhd = ds; nh = it; }
            } else if (it.type === IT.BE) {
                if (ds <= 10 && ds < nbld) { nbld = ds; nbl = it; }
            }
        }
        if (nh) { tgx = ch.gxr + (ch.gxr - nh.gx) * 5; tgy = ch.gyr + (ch.gyr - nh.gy) * 5; }
        else if (nbl) { tgx = nbl.gx; tgy = nbl.gy; }
    }
    let cx = Math.round(ch.gx), cy = Math.round(ch.gy);
    let amt = ch.sp * ch.sm * dt;
    if (Math.abs(ch.gx - cx) < amt * 1.5 && Math.abs(ch.gy - cy) < amt * 1.5) {
        if (cx !== ch._lcx || cy !== ch._lcy) {
            ch._lcx = cx;
            ch._lcy = cy;
            ch.gx = cx;
            ch.gy = cy;
            let dir = bfs(ch.gx, ch.gy, tgx, tgy);
            if (dir) {
                ch.dx = dir[0];
                ch.dy = dir[1];
            } else {
                let ds = ch.gDirs();
                let filtered = [];
                for (let k = 0; k < ds.length; k++) {
                    if (!(ds[k][0] === -ch.dx && ds[k][1] === -ch.dy)) filtered.push(ds[k]);
                }
                if (!filtered.length) { ch.dx = -ch.dx; ch.dy = -ch.dy; }
                else {
                    let d = filtered[Math.floor(Math.random() * filtered.length)];
                    ch.dx = d[0];
                    ch.dy = d[1];
                }
            }
        }
    }
    ch.upd(dt);
    // Stuck detection: if stopped for >1s, force chase NG
    if (ch._stuck === undefined) ch._stuck = 0;
    if (ch.dx === 0 && ch.dy === 0 && !ch.blk) {
        ch._stuck += dt;
        if (ch._stuck > 1) {
            ch._stuck = 0;
            ch._lcx = null;
            ch._lcy = null;
            tgx = NG.gx; tgy = NG.gy;
            let sdir = bfs(Math.round(ch.gx), Math.round(ch.gy), Math.round(tgx), Math.round(tgy));
            if (sdir) { ch.dx = sdir[0]; ch.dy = sdir[1]; }
        }
    } else {
        ch._stuck = 0;
    }
}

function dst(a, b) {
    let dx = a.gx - b.gx, dy = a.gy - b.gy;
    return Math.sqrt(dx * dx + dy * dy);
}

function cIC(ch) {
    let gx = ch.gxr, gy = ch.gyr;
    if (food[gy] && food[gy][gx] >= 0) {
        let tp = food[gy][gx];
        if (ch === NG) { sc += IS[tp]; aIE(ch, tp); }
        food[gy][gx] = -1;
    }
    for (let k = 0; k < spItems.length; k++) {
        let it = spItems[k];
        if (it.et) continue;
        if (dst(ch, { gx: it.gx, gy: it.gy }) < 0.8) {
            it.et = true;
            if (ch === NG) { sc += IS[it.type]; aIE(ch, it.type); }
        }
    }
}

function cEC() { return dst(NG, BT) < 0.65 || dst(NG, JT) < 0.65; }

function cEIC(ch) {
    for (let k = 0; k < spItems.length; k++) {
        let it = spItems[k];
        if (it.et) continue;
        if (dst(ch, { gx: it.gx, gy: it.gy }) < 0.8) {
            it.et = true;
            if (ch === BT) {
                if (it.type === IT.JK || it.type === IT.HP) {
                    ch.sm = Math.max(ch.sm, 1.1);
                    setTimeout(function() { ch.sm = Math.min(ch.sm, 1); }, 5000);
                }
            } else if (ch === JT) {
                if (it.type === IT.HP || it.type === IT.BE || it.type === IT.JK) {
                    ch.sm = Math.max(ch.sm, 1.1);
                    setTimeout(function() { ch.sm = Math.min(ch.sm, 1); }, 5000);
                }
            }
        }
    }
}

function pD() {
    lives--;
    uH();
    if (lives <= 0) { GO(); return; }
    NG.reset(16, 26);
    BT.reset(17, 16);
    JT.reset(16, 16);
    NG.blk = true;
    NG.bt = 1.5;
    cdT = 2;
}

function GO() {
    S = "gameover";
    document.getElementById("ol").classList.remove("hidden");
    document.getElementById("ol").innerHTML = '<h1>💔 游戏结束</h1><p class="sub">最终得分: <b style="color:#ffcc00;font-size:22px">' + sc + '</b></p><p class="sub">到达第 <b style="color:#fff">' + lv + '</b> 关</p><button id="btnStart2" class="stb">🔄 再来一局</button><button class="bb" onclick="G.showMenu()">← 返回标题</button>';
    document.getElementById("btnStart2").addEventListener("click", start);
    if (bgmAudio) bgmAudio.pause();
}

function lC() {
    S = "levelclear";
    document.getElementById("la").textContent = "🎉 通关！";
    document.getElementById("la").classList.add("show");
    setTimeout(function() {
        document.getElementById("la").classList.remove("show");
        lv++;
        uH();
        iLv();
        sLA();
        S = "playing";
    }, 2000);
}

function uH() {
    document.getElementById("sd").textContent = sc;
    document.getElementById("ld").textContent = lv;
    let h = "";
    for (let i = 0; i < Math.min(lives, 5); i++) h += "❤️";
    document.getElementById("lvd").textContent = h || "💔";
}

function gL(ts) {
    if (!lt) lt = ts;
    let dt = Math.min((ts - lt) / 1000, 0.05);
    lt = ts;
    if (S !== "playing" && S !== "countdown") {
        aid = requestAnimationFrame(gL);
        render();
        return;
    }
    if (cdT > 0) {
        cdT -= dt;
        if (cdT <= 0) { cdT = 0; if (S === "countdown") S = "playing"; }
    }
    if (S === "playing") {
        gt += dt;
        updateDoors(dt);
        if (gt >= 6) {
            spT -= dt;
            if (spT <= 0) { spRI(); spT = 3; }
        }
        NG.upd(dt);
        uAI(BT, true, dt);
        uAI(JT, false, dt);

        cIC(NG);
        cEIC(BT);
        cEIC(JT);
        if (!NG.blk && cEC()) {
            pD();
            if (S === "gameover") { render(); return; }
        }
        if (sc >= nextLife && lives < 5) {
            lives++;
            nextLife += 1000;
            uH();
        }
        if (cft(IT.CF) === 0) lC();
        uH();
    }
    render();
    aid = requestAnimationFrame(gL);
}

function render() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    dM();
    dI();
    if (NG) dCh(NG);
    if (BT) dCh(BT);
    if (JT) dCh(JT);
    if (cdT > 0) dCD();
}

// ---- Input ----
function hKD(e) {
    if (!NG || S !== "playing") return;
    let k = e.key;
    if (k === "ArrowUp" || k === "w" || k === "W") { NG.setD(0, -1); e.preventDefault(); }
    else if (k === "ArrowDown" || k === "s" || k === "S") { NG.setD(0, 1); e.preventDefault(); }
    else if (k === "ArrowLeft" || k === "a" || k === "A") { NG.setD(-1, 0); e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { NG.setD(1, 0); e.preventDefault(); }
}

function dp(d) {
    if (!NG) return;
    if (d === "up") NG.setD(0, -1);
    else if (d === "down") NG.setD(0, 1);
    else if (d === "left") NG.setD(-1, 0);
    else if (d === "right") NG.setD(1, 0);
}
